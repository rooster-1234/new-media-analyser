services:
  new-media-analyser:
    build: .
    container_name: new-media-analyser
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./app.py:/app/app.py
      - ./filter.py:/app/filter.py
      - ./scraper.py:/app/scraper.py
      - ./user_manager.py:/app/user_manager.py
    environment:
      - PORT=8080
      - HOST=0.0.0.0
